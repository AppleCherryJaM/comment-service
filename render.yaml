services:
  # NestJS Web Service (Backend)
  - type: web
    name: comments-server
    env: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run seed && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: comments-postgres
          property: connectionString

  # React Static Site (Frontend)
  - type: web
    name: comments-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: comments-postgres
    databaseName: comments_db
    region: frankfurt
    plan: free
