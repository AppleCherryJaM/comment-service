<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .outline { fill: none; stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; }
      .text-brand { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 52px; font-weight: 800; letter-spacing: 6px; fill: #1a1a1a; }
      .text-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 5px; fill: #6b7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="400" height="400" rx="32"/>

  <!-- Badge ring -->
  <circle class="outline" cx="200" cy="155" r="90" stroke-width="5"/>

  <!-- Left speech bubble -->
  <path class="outline" d="M 148,125 
           C 135,125 128,133 128,148 
           C 128,163 135,171 145,171 
           L 152,171 
           L 158,186 
           L 164,171 
           L 172,171 
           C 180,171 186,163 186,148" stroke-width="4.5"/>

  <!-- Right speech bubble -->
  <path class="outline" d="M 252,125 
           C 265,125 272,133 272,148 
           C 272,163 265,171 255,171 
           L 248,171 
           L 242,186 
           L 236,171 
           L 228,171 
           C 220,171 214,163 214,148" stroke-width="4.5"/>

  <!-- Center dot -->
  <circle cx="200" cy="148" r="5" fill="#1a1a1a"/>

  <!-- Brand name -->
  <text class="text-brand" x="200" y="295" text-anchor="middle">CTA</text>

  <!-- Subtitle -->
  <text class="text-sub" x="200" y="325" text-anchor="middle">CHAT TEST APP</text>
</svg>